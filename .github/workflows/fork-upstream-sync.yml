# Fork only (anentropic/5e-quint): merge upstream into main every week. See FORK.md.
name: Fork upstream sync

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream master into main
    if: github.repository == 'anentropic/5e-quint'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Add the SYNC_TOKEN secret (see FORK.md). GITHUB_TOKEN can't push upstream's workflow changes, and pull requests it opens don't run CI."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_AUTO_MERGE: ${{ vars.SYNC_AUTO_MERGE }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/fork/upstream-sync.sh
