name: Quality

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  quality:
    name: Resource-bounded workspace quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOMEMLIMIT: 8GiB
      GOGC: "75"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Run workspace quality gate
        # The coverage jobs below run the coverage check in parallel shards.
        run: pnpm quality:milestone --defer coverage

      - name: Verify packed SDK and MCP consumers
        run: pnpm check:distribution

      - name: Record distribution source
        run: git rev-parse HEAD > dist/npm/source.txt

      - name: Upload verified npm distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-distribution
          if-no-files-found: error
          path: |
            dist/npm/*.tgz
            dist/npm/verification.json
            dist/npm/source.txt

  coverage-shards:
    name: List coverage shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.list.outputs.shards }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: List coverage shards
        id: list
        run: |
          set -euo pipefail
          echo "shards=$(node scripts/workspace-quality-harness.mjs coverage:shards)" >> "$GITHUB_OUTPUT"

  coverage:
    name: Coverage (${{ matrix.shard }})
    needs: coverage-shards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOMEMLIMIT: 8GiB
      GOGC: "75"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.coverage-shards.outputs.shards) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Build
        run: pnpm build

      - name: Run coverage shard
        run: pnpm coverage --shard ${{ matrix.shard }}

  quality-gate:
    name: Workspace quality gate
    if: always()
    needs: [quality, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the milestone and every coverage shard to pass
        if: needs.quality.result != 'success' || needs.coverage.result != 'success'
        run: |
          echo "::error::Milestone result was ${{ needs.quality.result }}; coverage result was ${{ needs.coverage.result }}."
          exit 1
